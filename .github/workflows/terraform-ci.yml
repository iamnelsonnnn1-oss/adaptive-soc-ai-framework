name: Terraform CI

on:
  push:
    paths:
      - ".github/workflows/terraform-ci.yml"
      - "1_Infrastructure_IaC/Terraform/**"
  pull_request:
    paths:
      - ".github/workflows/terraform-ci.yml"
      - "1_Infrastructure_IaC/Terraform/**"

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_WORKING_DIR: "1_Infrastructure_IaC/Terraform"

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.8

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v6

      - name: Check Terraform formatting
        run: terraform -chdir="$TF_WORKING_DIR" fmt -check

      - name: Initialize Terraform
        run: terraform -chdir="$TF_WORKING_DIR" init -backend=false

      - name: Validate Terraform configuration
        run: terraform -chdir="$TF_WORKING_DIR" validate

      - name: Initialize TFLint plugins
        run: tflint --chdir="$TF_WORKING_DIR" --init

      - name: Run TFLint
        run: tflint --chdir="$TF_WORKING_DIR"

      - name: Run Terraform tests
        run: terraform -chdir="$TF_WORKING_DIR" test

name: Ansible CI

on:
  push:
    paths:
      - ".github/workflows/ansible-ci.yml"
      - "1_Infrastructure_IaC/Ansible/**"
      - "1_Infrastructure_IaC/Terraform/terraform.tfvars"
      - "1_Infrastructure_IaC/Terraform/providers.tf"
  pull_request:
    paths:
      - ".github/workflows/ansible-ci.yml"
      - "1_Infrastructure_IaC/Ansible/**"
      - "1_Infrastructure_IaC/Terraform/terraform.tfvars"
      - "1_Infrastructure_IaC/Terraform/providers.tf"

permissions:
  contents: read

env:
  ANSIBLE_CONFIG: 1_Infrastructure_IaC/Ansible/ansible.cfg
  ANSIBLE_WORKING_DIR: 1_Infrastructure_IaC/Ansible

jobs:
  ansible:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: python -m pip install --upgrade pip ansible-core

      - name: Install required collections
        run: ansible-galaxy collection install -r collections/requirements.yml
        working-directory: ${{ env.ANSIBLE_WORKING_DIR }}

      - name: Inspect demo inventory graph
        run: ansible-inventory -i inventory/demo.mock.yml --graph
        working-directory: ${{ env.ANSIBLE_WORKING_DIR }}

      - name: Syntax check inventory validation playbook
        run: ansible-playbook -i inventory/demo.mock.yml playbooks/validate_inventory.yml --syntax-check
        working-directory: ${{ env.ANSIBLE_WORKING_DIR }}

      - name: Syntax check bootstrap playbook
        run: ansible-playbook -i inventory/demo.mock.yml playbooks/bootstrap_linux.yml --syntax-check
        working-directory: ${{ env.ANSIBLE_WORKING_DIR }}

      - name: Validate Terraform handoff contract
        run: ansible-playbook -i inventory/demo.mock.yml playbooks/validate_handoff_contract.yml
        working-directory: ${{ env.ANSIBLE_WORKING_DIR }}

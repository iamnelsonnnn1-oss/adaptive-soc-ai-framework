apiVersion: apps/v1
kind: Deployment
metadata:
  name: soc-demo-service
  namespace: adaptive-soc
spec:
  template:
    spec:
      containers:
        - name: soc-demo-service
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi

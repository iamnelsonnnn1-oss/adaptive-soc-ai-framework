apiVersion: apps/v1
kind: Deployment
metadata:
  name: soc-demo-service
  namespace: adaptive-soc
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: soc-demo-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: soc-demo-service
    spec:
      containers:
      - name: soc-demo-service
        image: soc-demo-service:latest
        envFrom:
        - configMapRef:
            name: soc-demo-service-config
        - secretRef:
            name: soc-demo-service-secrets
        ports:
        - containerPort: 8080
          name: http

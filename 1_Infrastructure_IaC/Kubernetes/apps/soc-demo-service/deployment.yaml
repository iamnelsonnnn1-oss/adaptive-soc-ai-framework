apiVersion: apps/v1
kind: Deployment
metadata:
  name: soc-demo-service
  namespace: adaptive-soc
  labels:
    app.kubernetes.io/name: soc-demo-service
    app.kubernetes.io/part-of: adaptive-soc-ai-framework
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: soc-demo-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: soc-demo-service
        app.kubernetes.io/part-of: adaptive-soc-ai-framework
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: soc-demo-service
          image: soc-demo-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: soc-demo-service-config
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true

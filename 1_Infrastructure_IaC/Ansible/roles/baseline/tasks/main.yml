---
- name: Ensure Python is present for Ansible-managed operations
  ansible.builtin.raw: test -e /usr/bin/python3 || (apt-get update -y && apt-get install -y python3)
  changed_when: false
  failed_when: false

- name: Gather package facts
  ansible.builtin.package_facts:
    manager: auto

- name: Ensure baseline packages are installed
  ansible.builtin.package:
    name:
      - curl
      - git
      - rsyslog
      - unzip
    state: present

- name: Ensure rsyslog service is enabled and running
  ansible.builtin.service:
    name: rsyslog
    enabled: true
    state: started
